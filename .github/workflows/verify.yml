name: Original code and numerical records
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify original source and data identities
        run: |
          mkdir -p verification
          python tools/verify_release.py | tee verification/source_checks.json
      - name: Reproduce completed numerical analyses
        run: |
          python campus_study/code/verify_current_study.py --root campus_study | tee verification/numerical_checks.json
          python tools/cue_availability.py | tee verification/cue_availability.json
      - uses: actions/upload-artifact@v4
        with:
          name: code-verification
          path: verification/
          retention-days: 30
