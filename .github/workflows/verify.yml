name: Source and numerical verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify source integrity and dataset records
        run: python tools/verify_release.py
      - name: Verify image-level study results
        run: python campus_study/code/verify_current_study.py
